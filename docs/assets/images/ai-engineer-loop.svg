<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" role="img" aria-label="The AI engineer loop: Understand, Plan, Build, Verify, Ship Mindfully">
  <rect width="900" height="220" rx="28" fill="#050505"/>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ef3340" /></marker></defs>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">
    <g transform="translate(90 110)"><circle r="52" fill="#111827" stroke="#ef3340" stroke-width="5"/><text y="-4" fill="#fff" font-size="18">UNDER-</text><text y="20" fill="#fff" font-size="18">STAND</text></g>
    <g transform="translate(270 110)"><circle r="52" fill="#111827" stroke="#ef3340" stroke-width="5"/><text y="7" fill="#fff" font-size="22">PLAN</text></g>
    <g transform="translate(450 110)"><circle r="52" fill="#111827" stroke="#ef3340" stroke-width="5"/><text y="7" fill="#fff" font-size="22">BUILD</text></g>
    <g transform="translate(630 110)"><circle r="52" fill="#111827" stroke="#ef3340" stroke-width="5"/><text y="7" fill="#fff" font-size="20">VERIFY</text></g>
    <g transform="translate(810 110)"><circle r="52" fill="#111827" stroke="#ef3340" stroke-width="5"/><text y="-4" fill="#fff" font-size="18">SHIP</text><text y="20" fill="#fff" font-size="18">MINDFULLY</text></g>
  </g>
  <g stroke="#ef3340" stroke-width="5" marker-end="url(#arrow)"><line x1="145" y1="110" x2="205" y2="110"/><line x1="325" y1="110" x2="385" y2="110"/><line x1="505" y1="110" x2="565" y2="110"/><line x1="685" y1="110" x2="745" y2="110"/></g>
</svg>
